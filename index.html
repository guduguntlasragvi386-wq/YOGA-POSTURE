<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">

    <title>PosturePerfect</title>

    <style>
        body {
            margin: 0;
            font-family: Arial, sans-serif;
            text-align: center;
            background: #f1f8f4;
        }

        header {
            background: #4caf50;
            color: white;
            padding: 20px;
        }

        h1 {
            margin: 0;
        }

        .container {
            padding: 20px;
        }

        #video {
            width: 90%;
            max-width: 600px;
            border-radius: 15px;
            transform: scaleX(-1);
            margin-top: 20px;
        }

        button {
            margin: 15px;
            padding: 12px 25px;
            font-size: 17px;
            border: none;
            border-radius: 8px;
            background: #4caf50;
            color: white;
            cursor: pointer;
        }

        button:hover {
            background: #388e3c;
        }

        #feedback {
            margin: 20px;
            padding: 15px;
            font-size: 22px;
            font-weight: bold;
        }
    </style>
</head>

<body>

<header>
    <h1>PosturePerfect</h1>
    <p>Real-Time Yoga Posture Detection</p>
</header>

<div class="container">

    <h2>Check Your Posture</h2>

    <video id="video" autoplay playsinline></video>

    <br>

    <button onclick="startCamera()">Start Camera</button>

    <div id="feedback">
        Camera not started
    </div>

</div>


<script type="module">

    import {
        PoseLandmarker,
        FilesetResolver
    } from "https://cdn.jsdelivr.net/npm/@mediapipe/tasks-vision@0.10.22";

    const video = document.getElementById("video");
    const feedback = document.getElementById("feedback");

    let poseLandmarker;
    let lastVideoTime = -1;


    // Load MediaPipe
    async function createPoseLandmarker() {

        const vision = await FilesetResolver.forVisionTasks(
            "https://cdn.jsdelivr.net/npm/@mediapipe/tasks-vision@0.10.22/wasm"
        );

        poseLandmarker = await PoseLandmarker.createFromOptions(
            vision,
            {
                baseOptions: {
                    modelAssetPath:
                        "https://storage.googleapis.com/mediapipe-models/pose_landmarker/pose_landmarker_lite/float16/1/pose_landmarker_lite.task"
                },

                runningMode: "VIDEO",

                numPoses: 1
            }
        );

        console.log("Pose detector ready");
    }


    // Start camera
    async function startCamera() {

        try {

            const stream = await navigator.mediaDevices.getUserMedia({
                video: true
            });

            video.srcObject = stream;

            feedback.innerHTML = "Camera started. Detecting posture...";

            video.addEventListener("loadeddata", predictPose);

        }

        catch (error) {

            console.error(error);

            feedback.innerHTML =
                "❌ Camera permission denied or unavailable.";

        }
    }


    // Calculate angle between three points
    function calculateAngle(a, b, c) {

        const radians =
            Math.atan2(c.y - b.y, c.x - b.x) -
            Math.atan2(a.y - b.y, a.x - b.x);

        let angle = Math.abs(radians * 180 / Math.PI);

        if (angle > 180) {
            angle = 360 - angle;
        }

        return angle;
    }


    // Detect posture
    async function predictPose() {

        if (!poseLandmarker) {
            await createPoseLandmarker();
        }

        const startTimeMs = performance.now();

        if (video.currentTime !== lastVideoTime) {

            lastVideoTime = video.currentTime;

            const results =
                poseLandmarker.detectForVideo(
                    video,
                    startTimeMs
                );

            if (
                results.landmarks &&
                results.landmarks.length > 0
            ) {

                const landmarks = results.landmarks[0];

                checkPosture(landmarks);

            } else {

                feedback.innerHTML =
                    "⚠️ No person detected";

            }
        }

        requestAnimationFrame(predictPose);
    }


    // Check body posture
    function checkPosture(landmarks) {

        /*
            MediaPipe landmark numbers:

            11 = Left Shoulder
            12 = Right Shoulder

            23 = Left Hip
            24 = Right Hip

            25 = Left Knee
            26 = Right Knee
        */

        const leftShoulder = landmarks[11];
        const rightShoulder = landmarks[12];

        const leftHip = landmarks[23];
        const rightHip = landmarks[24];

        const leftKnee = landmarks[25];
        const rightKnee = landmarks[26];


        // Calculate left knee angle
        const leftKneeAngle =
            calculateAngle(
                leftHip,
                leftKnee,
                landmarks[27]
            );


        // Calculate right knee angle
        const rightKneeAngle =
            calculateAngle(
                rightHip,
                rightKnee,
                landmarks[28]
            );


        /*
            Simple posture rule.

            For demonstration:
            If the knee angles are reasonably straight,
            posture is considered correct.

            This rule can later be customized
            for different yoga poses.
        */

        if (
            leftKneeAngle > 150 &&
            rightKneeAngle > 150
        ) {

            feedback.innerHTML =
                "✅ Correct Posture";

        } else {

            feedback.innerHTML =
                "⚠️ Incorrect Posture! Adjust your position.";

        }
    }

</script>

</body>
</html>
